version: '3.8'
services:
  db:
    # Local Postgres used by the Flask backend during demos/development.
    image: postgres:15
    container_name: buckaroo-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
