[pytest]
# Add project root to PYTHONPATH
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    sql: SQL integration tests that require database
    slow: Slow-running tests (skip with: pytest -m "not slow")

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra

# Minimum pytest version
minversion = 7.0
